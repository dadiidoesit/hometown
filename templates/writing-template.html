<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    /* Based on bugboyblack style */
    html { font-size: 100%; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { max-width: 36em; margin: 2.5em auto; padding: 0 1.2em; font-family: "Georgia", serif; line-height: 1.65; color: #1a1a1a; background-color: #fdfdf8; text-rendering: optimizeLegibility; position: relative; }
    .toc-nav { position: sticky; top: 0; z-index: 100; background: #fdfdf8; border-bottom: 1px solid #c4b6a6; padding: 0.6em 1.2em 0.4em 1.2em; margin: -2.5em -1.2em 1.8em -1.2em; font-size: 0.9rem; display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.5em 1.2em; }
    .toc-nav a { color: #4b3b2b; text-decoration: none; border-bottom: 1px dotted #b7a48b; transition: color 0.2s; }
    .toc-nav a:hover { color: #1a1a1a; border-bottom-color: #7b6e5a; }
    .meta-line { font-size: 0.95rem; margin-bottom: 2.8em; color: #2c2c2c; }
    h2 { margin-top: 2.2em; margin-bottom: 0.6em; }
    p { margin: 0 0 1.25em 0; text-align: justify; }
    p + p { text-indent: 1.6em; }
    .first-paragraph, h2 + p { text-indent: 0; }
  </style>
</head>
<body>
<a id="top"></a>
<nav class="toc-nav" aria-label="Contents">
  <span class="nav-label">Contents</span>
  {{TOC}}
  <span class="nav-spacer"></span>
  <a href="#top" class="back-top-link">↑ Back to top</a>
</nav>

<p class="meta-line">
  {{TITLE}}<br>
  {{SUBTITLE}}
</p>

<hr>

{{CONTENT}}

<hr>
<div class="back-top-container" style="text-align: center; margin-top: 2.4em;">
  <a href="#top" style="text-decoration: none; color: #4b3b2b; border-bottom: 1px dotted #b7a48b;">↑ Back to top</a>
</div>

<div class="return-link" style="text-align: center; margin-top: 2.4em;">
  <p><a href="../writing.html" style="text-decoration: none; color: #4b3b2b; border-bottom: 1px dotted #b7a48b;">back</a></p>
</div>

</body>
</html>
