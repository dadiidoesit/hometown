<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<style>
  :root{
    --bg:#0d0d0d;
    --gap:6px;
    --unit:110px;
    --fade-ms:600ms;
  }
  @media (max-width:640px){ :root{ --unit:80px; } }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eee;}
  #collage{display:grid;gap:var(--gap);padding:var(--gap);justify-content:center;}
  #collage figure{
    margin:0;position:relative;overflow:hidden;border-radius:4px;background:#111;
    min-width:0;min-height:0;
    opacity:0;transform:scale(1.02);
    animation:reveal var(--fade-ms) ease forwards;
    animation-delay:calc(var(--i, 0) * 25ms);
  }
  @keyframes reveal{to{opacity:1;transform:scale(1);}}
  #collage a{display:block;width:100%;height:100%;}
  #collage img{width:100%;height:100%;object-fit:cover;display:block;}
  #err{
    position:fixed;bottom:0;left:0;right:0;padding:10px 16px;
    background:#3a1414;color:#f3caca;font-size:13px;display:none;
  }
</style>
</head>
<body>
<div id="collage"></div>
<div id="err" role="alert"></div>
<script>
/* CONFIG */
const COOKIE_NAME   = "galleryBeaconValue";
const COOKIE_DAYS   = 3;
const SAMPLE_SIZE   = 24;
const BIG_THRESHOLD = 40;
const BEACON_PROXY  = "https://api.allorigins.win/raw?url=";
const BEACON_URL    = "https://beacon.nist.gov/beacon/2.0/pulse/last";
const GITHUB_OWNER  = "dadiidoesit";
const GITHUB_REPO   = "hometown";
const GITHUB_PATH   = "photo/img";
const GITHUB_BRANCH = "main";
const IMAGE_EXT_RE  = /\.(jpe?g|png|webp|avif|gif)$/i;
const SHAPES = {
  sq:  { cols:1, rows:1 },
  wide:{ cols:2, rows:1 },
  tall:{ cols:1, rows:2 },
  big: { cols:2, rows:2 }
};
const DOWNGRADE = {big:["wide","tall","sq"],wide:["sq"],tall:["sq"],sq:[]};

function getCookie(name){
  const m=document.cookie.match(new RegExp('(?:^|; )'+name+'=([^;]*)'));
  return m?decodeURIComponent(m[1]):null;
}
function setCookie(name,value,days){
  document.cookie=`${name}=${encodeURIComponent(value)}; max-age=${days*86400}; path=/; SameSite=Lax`;
}
function hexToBytes(hex){
  const out=new Uint8Array(hex.length/2);
  for(let i=0;i<out.length;i++)out[i]=parseInt(hex.slice(i*2,i*2+2),16);
  return out;
}
function makeByteStream(bytes){
  let cursor=0;
  return {
    nextByte(){const b=bytes[cursor%bytes.length];cursor++;return b;},
    nextInt(maxExclusive){return this.nextByte()%maxExclusive;},
    nextFloat(){return this.nextByte()/255;}
  };
}
function randomHex(){
  const buf=new Uint8Array(64);
  crypto.getRandomValues(buf);
  return Array.from(buf,b=>b.toString(16).padStart(2,"0")).join("");
}
async function getEntropyHex(){
  const cached=getCookie(COOKIE_NAME);
  if(cached && cached.length>=2 && cached.length%2===0 && /^[0-9a-fA-F]+$/.test(cached)){
    setCookie(COOKIE_NAME,cached,COOKIE_DAYS);
    return cached;
  }
  // Beacon is optional: a slow or blocked third-party proxy must not block the gallery.
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),1800);
  try{
    const res=await fetch(BEACON_PROXY+encodeURIComponent(BEACON_URL),{signal:controller.signal});
    if(!res.ok)throw new Error("beacon proxy HTTP "+res.status);
    const data=await res.json();
    const hex=data?.pulse?.outputValue;
    if(typeof hex!=="string" || hex.length<2 || hex.length%2 || !/^[0-9a-fA-F]+$/.test(hex)){
      throw new Error("invalid beacon output");
    }
    setCookie(COOKIE_NAME,hex,COOKIE_DAYS);
    return hex;
  }catch(e){
    // The browser's cryptographically secure random source is fully sufficient here.
    // Don't show a scary red error bar for a working fallback.
    const hex=randomHex();
    setCookie(COOKIE_NAME,hex,COOKIE_DAYS);
    return hex;
  }finally{clearTimeout(timer);}
}

async function fetchRepoImages(){
  const url=`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}?ref=${GITHUB_BRANCH}`;
  const res=await fetch(url,{headers:{"Accept":"application/vnd.github+json"}});
  if(!res.ok)throw new Error("GitHub API HTTP "+res.status);
  const list=await res.json();
  if(!Array.isArray(list))throw new Error("Unexpected GitHub API response");
  return list.filter(item=>item.type==="file" && IMAGE_EXT_RE.test(item.name))
             .map(item=>({name:item.name,src:item.download_url}));
}

function setGridDimensions(collage){
  const vars=getComputedStyle(document.documentElement);
  const unit=parseFloat(vars.getPropertyValue("--unit"));
  const gap=parseFloat(vars.getPropertyValue("--gap"));
  const width=Math.max(1,collage.clientWidth||window.innerWidth);
  const cols=Math.max(1,Math.floor((width-gap)/(unit+gap)));
  collage.style.gridTemplateColumns=`repeat(${cols}, ${unit}px)`;
  collage.style.gridAutoRows=`${unit}px`;
  return cols;
}

function buildFigures(collage,images){
  const frag=document.createDocumentFragment();
  const figures=[];
  images.forEach(({name,src})=>{
    const fig=document.createElement("figure");
    const link=document.createElement("a");
    link.href=src;
    link.target="_blank";
    link.rel="noopener";
    const img=document.createElement("img");
    img.className="gallery-img";
    img.crossOrigin="anonymous";
    // Important: do not use lazy loading before the collage is laid out.
    // Lazy images offscreen will never load while layout waits for them.
    img.loading="eager";
    img.decoding="async";
    img.alt=name;
    img.src=src;
    link.appendChild(img);
    fig.appendChild(link);
    frag.appendChild(fig);
    figures.push(fig);
  });
  collage.appendChild(frag);
  return figures;
}

function computeEdgeSignature(img){
  const c=document.createElement("canvas");c.width=SAMPLE_SIZE;c.height=SAMPLE_SIZE;
  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(img,0,0,SAMPLE_SIZE,SAMPLE_SIZE);
  const data=ctx.getImageData(0,0,SAMPLE_SIZE,SAMPLE_SIZE).data;
  const px=(x,y)=>{const i=(y*SAMPLE_SIZE+x)*4;return [data[i],data[i+1],data[i+2]];};
  const avg=pts=>pts.reduce((s,[x,y])=>{const c=px(x,y);return [s[0]+c[0],s[1]+c[1],s[2]+c[2]];},[0,0,0]).map(v=>v/pts.length);
  const col=x=>Array.from({length:SAMPLE_SIZE},(_,y)=>[x,y]);
  const row=y=>Array.from({length:SAMPLE_SIZE},(_,x)=>[x,y]);
  return {left:avg(col(0)),right:avg(col(SAMPLE_SIZE-1)),top:avg(row(0)),bottom:avg(row(SAMPLE_SIZE-1))};
}
function colorDist(a,b){const dr=a[0]-b[0],dg=a[1]-b[1],db=a[2]-b[2];return Math.sqrt(dr*dr+dg*dg+db*db);}
function invert(c){return [255-c[0],255-c[1],255-c[2]];}
const MAX_DIST=colorDist([0,0,0],[255,255,255]);
function edgeAffinity(a,b){return Math.max(1-colorDist(a,b)/MAX_DIST,1-colorDist(a,invert(b))/MAX_DIST);}
function preferredShape(img,stream){
  if(stream.nextByte()<BIG_THRESHOLD)return "big";
  const ratio=img.naturalHeight?img.naturalWidth/img.naturalHeight:1;
  if(ratio>1.35)return "wide";
  if(ratio<0.75)return "tall";
  return "sq";
}

function packGrid(items,cols,stream){
  const occ=[];
  function ensureRow(r){while(occ.length<=r)occ.push(new Array(cols).fill(null));}
  function fits(r,c,w,h){
    if(c+w>cols)return false;
    ensureRow(r+h-1);
    for(let dr=0;dr<h;dr++)for(let dc=0;dc<w;dc++)if(occ[r+dr][c+dc])return false;
    return true;
  }
  function place(item,r,c,w,h){
    for(let dr=0;dr<h;dr++)for(let dc=0;dc<w;dc++)occ[r+dr][c+dc]=item;
    item.placement={r,c,w,h};
  }
  const pool=items.slice();
  let r=0,c=0,order=0;
  while(pool.length){
    ensureRow(r);
    if(occ[r][c]){c++;if(c>=cols){c=0;r++;}continue;}
    const left=c>0?occ[r][c-1]:null;
    const top=r>0?occ[r-1][c]:null;
    let bestIdx=-1,bestShape=null,bestScore=-Infinity;
    for(let i=0;i<pool.length;i++){
      const cand=pool[i];
      for(const shapeName of [cand.shape,...DOWNGRADE[cand.shape]]){
        const {cols:w,rows:h}=SHAPES[shapeName];
        if(!fits(r,c,w,h))continue;
        let factors=0,sum=0;
        if(left){sum+=edgeAffinity(left.sig.right,cand.sig.left);factors++;}
        if(top){sum+=edgeAffinity(top.sig.bottom,cand.sig.top);factors++;}
        let score=factors?sum/factors:stream.nextFloat();
        score+=stream.nextFloat()*0.0001;
        if(score>bestScore){bestScore=score;bestIdx=i;bestShape=shapeName;}
        break;
      }
    }
    if(bestIdx===-1){c++;if(c>=cols){c=0;r++;}continue;}
    const chosen=pool.splice(bestIdx,1)[0];
    const {cols:w,rows:h}=SHAPES[bestShape];
    place(chosen,r,c,w,h);
    chosen.fig.classList.add(bestShape);
    chosen.fig.style.gridColumn=`${c+1} / span ${w}`;
    chosen.fig.style.gridRow=`${r+1} / span ${h}`;
    chosen.fig.style.setProperty("--i",order++);
    c++;if(c>=cols){c=0;r++;}
  }
}

const NEUTRAL={left:[128,128,128],right:[128,128,128],top:[128,128,128],bottom:[128,128,128]};
function loaded(img){return img.complete && img.naturalWidth>0;}
function waitForImage(img){
  if(img.complete)return Promise.resolve();
  return new Promise(resolve=>{
    img.addEventListener("load",resolve,{once:true});
    img.addEventListener("error",resolve,{once:true});
  });
}

async function main(){
  const collage=document.getElementById("collage");
  const errEl=document.getElementById("err");
  // Fetch entropy concurrently with the image listing, not after loading photos.
  const entropyPromise=getEntropyHex();
  let images;
  try{images=await fetchRepoImages();}
  catch(e){
    errEl.style.display="block";
    errEl.textContent="Couldn't list images from GitHub — check the image folder or GitHub API access.";
    return;
  }
  if(!images.length)return;

  // Critical fix: establish tile widths/rows BEFORE inserting any image elements.
  const cols=setGridDimensions(collage);
  const figures=buildFigures(collage,images);

  // Don't wait indefinitely for slow/broken images. Pack with a neutral edge
  // signature for any images that haven't loaded after a brief grace period.
  await Promise.race([
    Promise.all(figures.map(fig=>waitForImage(fig.querySelector("img")))),
    new Promise(resolve=>setTimeout(resolve,4500))
  ]);
  const hex=await entropyPromise;
  const stream=makeByteStream(hexToBytes(hex));
  const items=figures.map(fig=>{
    const img=fig.querySelector("img");
    let sig=NEUTRAL;
    if(loaded(img)){
      try{sig=computeEdgeSignature(img);}catch(e){}
    }
    return {fig,sig,shape:preferredShape(img,stream)};
  });
  packGrid(items,cols,stream);
}

main();
</script>
</body>
</html>
